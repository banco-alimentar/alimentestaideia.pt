# Replaces classic build "Alimentestaideia.pt Core" (definition id=8).
# Produces Release Web + TenantManagement + Function zips for preprod/prod releases.
#
# Setup in Azure DevOps:
#   1. Edit pipeline id=8 -> point at /azure-pipelines/core-build.yml (or create new YAML pipeline)
#   2. Install marketplace extension: Replace Tokens (replacetokens@5)
#   3. Authorize ARM service connection on first run
#   4. Disable classic designer steps after a green YAML run
#
# preprod-release.yml consumes artifact "drop" from pipeline name "Alimentestaideia.pt Core".

trigger:
  branches:
    include:
      - developer
      - master
  paths:
    include:
      - '**/*.cs'

pr: none

variables:
  BuildConfiguration: Release
  BuildPlatform: any cpu
  # Restore/build only release entry points; MSBuild includes their referenced libraries.
  DeployableProjects: |
    BancoAlimentar.AlimentaEstaIdeia.Web/BancoAlimentar.AlimentaEstaIdeia.Web.csproj
    BancoAlimentar.AlimentaEstaIdeia.Sas.Web.TenantManagement/BancoAlimentar.AlimentaEstaIdeia.Sas.Web.TenantManagement.csproj
    BancoAlimentar.AlimentaEstaIdeia.Function/BancoAlimentar.AlimentaEstaIdeia.Function.csproj
  AzureServiceConnection: 'Microsoft Azure Sponsorship BA(f1b937fb-ca82-4eb6-a452-77af7a531344)'
  KeyVaultName: alimentaestaideia-key

stages:
  # Keep a credential-free root stage when release packaging is not allowed. Azure may
  # still queue this pipeline for PR validation even though YAML declares pr: none.
  - ${{ if not(and(ne(variables['Build.Reason'], 'PullRequest'), in(variables['Build.Reason'], 'IndividualCI', 'BatchedCI', 'Manual'), in(variables['Build.SourceBranch'], 'refs/heads/developer', 'refs/heads/master'))) }}:
    - stage: NoReleaseBuild
      displayName: No release build for this run
      jobs:
        - job: SkipReleaseBuild
          displayName: Skip release packaging
          pool:
            name: Default
          workspace:
            clean: all
          steps:
            - bash: echo "Core release packaging runs only for trusted developer and master builds."
              displayName: Explain skipped release build

  # Omit credentialed stages entirely for PRs, tags, feature refs, and unknown reasons.
  - ${{ if and(ne(variables['Build.Reason'], 'PullRequest'), in(variables['Build.Reason'], 'IndividualCI', 'BatchedCI', 'Manual'), in(variables['Build.SourceBranch'], 'refs/heads/developer', 'refs/heads/master')) }}:
    - stage: Build
      displayName: Build and publish
      condition: >-
        and(
          succeeded(),
          ne(variables['Build.Reason'], 'PullRequest'),
          in(variables['Build.Reason'], 'IndividualCI', 'BatchedCI', 'Manual'),
          in(variables['Build.SourceBranch'], 'refs/heads/developer', 'refs/heads/master')
        )
      jobs:
        - job: Build
          displayName: Build
          pool:
            name: Default
          workspace:
            clean: all
          steps:
            - task: AzureKeyVault@2
              displayName: 'Azure Key Vault $(KeyVaultName)'
              inputs:
                ConnectedServiceName: $(AzureServiceConnection)
                KeyVaultName: $(KeyVaultName)
                SecretsFilter: '*'
                RunAsPreJob: true

            - task: replacetokens@5
              displayName: Replace tokens in json config
              inputs:
                rootDirectory: $(Build.SourcesDirectory)
                targetFiles: '**/*.json'
                tokenPattern: default
                tokenPrefix: '#{'
                tokenSuffix: '}#'
                actionOnMissing: warn
                missingVarAction: none
                defaultValue: ''

            - task: PowerShell@2
              displayName: Version .NET assemblies
              inputs:
                targetType: filePath
                filePath: $(Build.SourcesDirectory)/scripts/ci/version-dotnet-assemblies.ps1
                arguments: '-Path "$(Build.SourcesDirectory)" -VersionNumber "$(Build.BuildNumber)" -BuildId $(Build.BuildId)'
                pwsh: true

            - task: UseDotNet@2
              displayName: Use .NET SDK 10.0.x
              inputs:
                packageType: sdk
                version: 10.0.x

            - template: templates/report-disk-usage.yml
              parameters:
                phase: before restore

            - task: DotNetCoreCLI@2
              displayName: Restore deployable projects
              inputs:
                command: restore
                projects: $(DeployableProjects)

            - template: templates/report-disk-usage.yml
              parameters:
                phase: after restore / before build

            - task: DotNetCoreCLI@2
              displayName: Build deployable projects
              inputs:
                command: build
                projects: $(DeployableProjects)
                arguments: '--configuration $(BuildConfiguration) --no-restore'

            - template: templates/report-disk-usage.yml
              parameters:
                phase: after build / before publish web

            - task: DotNetCoreCLI@2
              displayName: Publish web
              inputs:
                command: publish
                publishWebProjects: false
                projects: BancoAlimentar.AlimentaEstaIdeia.Web/BancoAlimentar.AlimentaEstaIdeia.Web.csproj
                arguments: '--configuration $(BuildConfiguration) --no-build --output $(Build.ArtifactStagingDirectory)'
                zipAfterPublish: true
                modifyOutputPath: true

            - template: templates/report-disk-usage.yml
              parameters:
                phase: after publish web / before publish tenant management

            - task: DotNetCoreCLI@2
              displayName: Publish tenant management
              inputs:
                command: publish
                publishWebProjects: false
                projects: BancoAlimentar.AlimentaEstaIdeia.Sas.Web.TenantManagement/BancoAlimentar.AlimentaEstaIdeia.Sas.Web.TenantManagement.csproj
                arguments: '--configuration $(BuildConfiguration) --no-build --output $(Build.ArtifactStagingDirectory)'
                zipAfterPublish: true
                modifyOutputPath: true

            - template: templates/report-disk-usage.yml
              parameters:
                phase: after publish tenant management / before publish function

            - task: DotNetCoreCLI@2
              displayName: Publish function
              inputs:
                command: publish
                publishWebProjects: false
                projects: BancoAlimentar.AlimentaEstaIdeia.Function/BancoAlimentar.AlimentaEstaIdeia.Function.csproj
                arguments: '--configuration $(BuildConfiguration) --no-build --output $(Build.ArtifactStagingDirectory)'
                zipAfterPublish: true
                modifyOutputPath: true

            - template: templates/report-disk-usage.yml
              parameters:
                phase: after publish function

            - task: DeleteFiles@1
              displayName: Remove local-only appsettings from web artifact folder
              inputs:
                SourceFolder: BancoAlimentar.AlimentaEstaIdeia.Web
                Contents: |
                  appsettings.Development.json
                  appsettings.IntegrationTesting.json

            - publish: $(Build.ArtifactStagingDirectory)
              artifact: drop
              displayName: Publish drop artifact
