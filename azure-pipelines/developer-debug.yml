# Merged from classic build "developer-debug" (id=11) and release "[DEV] AlimentaEstaIdeia" (id=3).
# Owns PR/push validation for developer/master and the weekly dependency audit.
# Uses the self-hosted Default Linux agent pool; only developer can deploy.
#
# Setup in Azure DevOps before first run:
#   1. Pipelines -> New pipeline -> Existing Azure Pipelines YAML file -> this path
#   2. Set variable AzureServiceConnection to your ARM service connection name
#      (classic pipeline GUID 7ada5308-2372-46ef-af95-bdfff138b059 → name below)
#   3. Ensure pipeline extensions are installed: Replace Tokens
#   4. Create Environments: Developer, Function developer (or rename below)
#   5. Keep YAML build id=11; disable classic release id=3 after validation
#   6. Require this pipeline on PRs before disabling the standalone Selenium definition
#   Isolated .NET/Selenium validation gates packaging/deployment; slot tests remain manual.

trigger:
  branches:
    include:
      - developer
      - master
  paths:
    include:
      - '**/*.cs'

pr:
  autoCancel: true
  branches:
    include:
      - developer
      - master
  paths:
    include:
      - '**/*.cs'

schedules:
  - cron: '23 6 * * 1'
    displayName: Weekly NuGet dependency audit
    branches:
      include:
        - master
    always: true

variables:
  BuildConfiguration: Debug
  BuildPlatform: any cpu
  AzureServiceConnection: 'Microsoft Azure Sponsorship BA(f1b937fb-ca82-4eb6-a452-77af7a531344)'
  KeyVaultName: alimentaestaideia-key
  ResourceGroupName: AlimenteEstaIdeia
  WebAppName: alimentaestaideia
  FunctionAppName: AlimentaEstaIdeia-tools
  DeveloperSlot: developer

stages:
  - stage: BrowserRegression
    displayName: Build, test and isolated browser regression
    condition: ne(variables['Build.Reason'], 'Schedule')
    jobs:
      - job: DotNetTests
        displayName: Build and test .NET solution
        pool:
          name: Default
        workspace:
          clean: all
        timeoutInMinutes: 60
        variables:
          DOTNET_CLI_TELEMETRY_OPTOUT: '1'
          DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
          DOTNET_NOLOGO: 'true'
          DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
          DOTNET_ADD_GLOBAL_TOOLS_TO_PATH: 'false'
          DOTNET_MULTILEVEL_LOOKUP: '0'
          TestResultsDirectory: $(Agent.TempDirectory)/dotnet-test-results
        steps:
          - checkout: self
            persistCredentials: false

          - task: UseDotNet@2
            displayName: Use .NET SDK 10.0.x
            inputs:
              packageType: sdk
              version: 10.0.x

          - bash: |
              set -euo pipefail
              echo "##[group]Runner and NuGet context"
              echo "Commit: $(git rev-parse --short HEAD)"
              echo "Runner OS/architecture: $(uname -srm)"
              echo "DOTNET_ROOT: ${DOTNET_ROOT:-<unset>}"
              dotnet --info
              echo "Configured NuGet sources:"
              dotnet nuget list source
              echo "NuGet cache locations:"
              dotnet nuget locals all --list
              echo "Available disk space:"
              df -h "$HOME" "${AGENT_TEMPDIRECTORY:-$HOME}"
              echo "##[endgroup]"
            displayName: Log runner and NuGet context

          - task: DotNetCoreCLI@2
            displayName: Build solution
            inputs:
              command: build
              projects: BancoAlimentar.AlimentaEstaIdeia.Web.sln
              arguments: '--configuration Release'

          - bash: |
              set -uo pipefail
              mkdir -p "$TEST_RESULTS_DIRECTORY"
              test_failure=0

              # Run sequentially: concurrent web-hosting test projects exhaust the agent user's
              # inotify instance limit (128) and slow timing-sensitive tests, without reducing wall time.
              run_test() {
                local name="$1"
                local project="$2"
                echo "##[group]Test $name"
                if dotnet test "$project" \
                  --configuration Release \
                  --no-build \
                  --verbosity normal \
                  --collect:"XPlat Code Coverage" \
                  --settings coverlet.runsettings \
                  --logger "trx;LogFileName=${name}.trx" \
                  --results-directory "$TEST_RESULTS_DIRECTORY/$name"; then
                  result=0
                else
                  result=$?
                fi
                echo '##[endgroup]'
                if [ "$result" -eq 0 ]; then
                  echo "$name tests passed"
                else
                  echo "##[error]$name tests failed with exit code $result"
                  test_failure=1
                fi
              }

              run_test Repository BancoAlimentar.AlimentaEstaIdeia.Repository.Tests/BancoAlimentar.AlimentaEstaIdeia.Repository.Tests.csproj
              run_test SasCore BancoAlimentar.AlimentaEstaIdeia.Sas.Core.Tests/BancoAlimentar.AlimentaEstaIdeia.Sas.Core.Tests.csproj
              run_test Integration BancoAlimentar.AlimentaEstaldeia.Web.IntegrationTests/BancoAlimentar.AlimentaEstaldeia.Web.Integration.Tests.csproj
              run_test Function BancoAlimentar.AlimentaEstaIdeia.Function.Tests/BancoAlimentar.AlimentaEstaIdeia.Function.Tests.csproj
              run_test CleanProdHarden BancoAlimentar.AlimentaEstaIdeia.Tools.CleanProdHarden.Tests/BancoAlimentar.AlimentaEstaIdeia.Tools.CleanProdHarden.Tests.csproj

              exit "$test_failure"
            displayName: Run all five test projects and collect coverage
            env:
              TEST_RESULTS_DIRECTORY: $(TestResultsDirectory)

          - task: PublishTestResults@2
            displayName: Publish .NET test results
            condition: always()
            inputs:
              testResultsFormat: VSTest
              testResultsFiles: '**/*.trx'
              searchFolder: $(TestResultsDirectory)
              testRunTitle: .NET tests ($(Build.SourceBranchName))
              failTaskOnFailedTests: true
              failTaskOnFailureToPublishResults: true
              failTaskOnMissingResultsFile: true
              publishRunAttachments: true

          - bash: |
              set -euo pipefail
              dotnet tool install --tool-path "$REPORT_GENERATOR_TOOLS" dotnet-reportgenerator-globaltool
              "$REPORT_GENERATOR_TOOLS/reportgenerator" \
                -reports:"$TEST_RESULTS_DIRECTORY/**/coverage.cobertura.xml" \
                -targetdir:"$TEST_RESULTS_DIRECTORY/CoverageReport" \
                -reporttypes:"Cobertura;HtmlInline;MarkdownSummaryGithub"
              cat "$TEST_RESULTS_DIRECTORY/CoverageReport/SummaryGithub.md"
              echo "##vso[task.uploadsummary]$TEST_RESULTS_DIRECTORY/CoverageReport/SummaryGithub.md"
            displayName: Merge coverage reports
            condition: always()
            env:
              REPORT_GENERATOR_TOOLS: $(Agent.TempDirectory)/reportgenerator
              TEST_RESULTS_DIRECTORY: $(TestResultsDirectory)

          - task: PublishCodeCoverageResults@2
            displayName: Publish Cobertura coverage
            condition: always()
            inputs:
              summaryFileLocation: $(TestResultsDirectory)/CoverageReport/Cobertura.xml
              pathToSources: $(Build.SourcesDirectory)
              failIfCoverageEmpty: true

          - task: PublishPipelineArtifact@1
            displayName: Publish HTML coverage report
            condition: always()
            inputs:
              targetPath: $(TestResultsDirectory)/CoverageReport
              artifact: code-coverage
              publishLocation: pipeline

      - template: templates/selenium-job.yml
        parameters:
          dependsOn:
            - DotNetTests
          condition: succeededOrFailed()

  # Omit credentialed stages entirely for PRs, tags, feature refs, and unknown reasons.
  - ${{ if and(ne(variables['Build.Reason'], 'PullRequest'), in(variables['Build.Reason'], 'IndividualCI', 'BatchedCI', 'Manual'), eq(variables['Build.SourceBranch'], 'refs/heads/developer')) }}:
    - stage: Build
      displayName: Build and package (Debug)
      dependsOn: BrowserRegression
      condition: >-
        and(
          succeeded(),
          eq(dependencies.BrowserRegression.result, 'Succeeded'),
          ne(variables['Build.Reason'], 'PullRequest'),
          in(variables['Build.Reason'], 'IndividualCI', 'BatchedCI', 'Manual'),
          eq(variables['Build.SourceBranch'], 'refs/heads/developer')
        )
      jobs:
        - job: Build
          displayName: Build
          pool:
            name: Default
          workspace:
            clean: all
          steps:
            - task: AzureKeyVault@2
              displayName: 'Azure Key Vault $(KeyVaultName)'
              inputs:
                ConnectedServiceName: $(AzureServiceConnection)
                KeyVaultName: $(KeyVaultName)
                SecretsFilter: '*'
                RunAsPreJob: true

            - task: replacetokens@5
              displayName: Replace tokens in json config
              inputs:
                rootDirectory: $(Build.SourcesDirectory)
                targetFiles: '**/*.json'
                tokenPattern: default
                tokenPrefix: '#{'
                tokenSuffix: '}#'
                actionOnMissing: warn
                missingVarAction: none
                defaultValue: ''

            - task: PowerShell@2
              displayName: Version .NET assemblies
              inputs:
                targetType: filePath
                filePath: $(Build.SourcesDirectory)/scripts/ci/version-dotnet-assemblies.ps1
                arguments: '-Path "$(Build.SourcesDirectory)" -VersionNumber "$(Build.BuildNumber)" -BuildId $(Build.BuildId)'
                pwsh: true

            - task: UseDotNet@2
              displayName: Use .NET SDK 10.0.x
              inputs:
                packageType: sdk
                version: 10.0.x

            - task: DotNetCoreCLI@2
              displayName: Build solution
              inputs:
                command: build
                projects: BancoAlimentar.AlimentaEstaIdeia.Web.sln
                arguments: '--configuration $(BuildConfiguration)'

            - task: DotNetCoreCLI@2
              displayName: Publish web
              inputs:
                command: publish
                publishWebProjects: false
                projects: BancoAlimentar.AlimentaEstaIdeia.Web/BancoAlimentar.AlimentaEstaIdeia.Web.csproj
                arguments: '--configuration $(BuildConfiguration) --no-build --output $(Build.ArtifactStagingDirectory)'
                zipAfterPublish: true
                modifyOutputPath: true

            - task: DotNetCoreCLI@2
              displayName: Publish function
              inputs:
                command: publish
                publishWebProjects: false
                projects: BancoAlimentar.AlimentaEstaIdeia.Function/BancoAlimentar.AlimentaEstaIdeia.Function.csproj
                arguments: '--configuration $(BuildConfiguration) --no-build --output $(Build.ArtifactStagingDirectory)'
                zipAfterPublish: true
                modifyOutputPath: true

            - task: DeleteFiles@1
              displayName: Remove local-only appsettings from web artifact folder
              inputs:
                SourceFolder: BancoAlimentar.AlimentaEstaIdeia.Web
                Contents: |
                  appsettings.Development.json
                  appsettings.IntegrationTesting.json

            - publish: $(Build.ArtifactStagingDirectory)
              artifact: drop
              displayName: Publish drop artifact

    - stage: DeployDeveloper
      displayName: Deploy developer slot
      dependsOn: [Build, BrowserRegression]
      condition: >-
        and(
          succeeded(),
          eq(dependencies.Build.result, 'Succeeded'),
          eq(dependencies.BrowserRegression.result, 'Succeeded'),
          ne(variables['Build.Reason'], 'PullRequest'),
          in(variables['Build.Reason'], 'IndividualCI', 'BatchedCI', 'Manual'),
          eq(variables['Build.SourceBranch'], 'refs/heads/developer')
        )
      jobs:
        - deployment: DeployWeb
          displayName: Deploy web to developer slot
          environment: Developer
          pool:
            name: Default
          workspace:
            clean: all
          strategy:
            runOnce:
              deploy:
                steps:
                  - download: current
                    artifact: drop

                  - task: AzureRmWebAppDeployment@4
                    displayName: Deploy Azure App Service (developer slot)
                    inputs:
                      ConnectionType: AzureRM
                      ConnectedServiceName: $(AzureServiceConnection)
                      WebAppKind: webApp
                      WebAppName: $(WebAppName)
                      DeployToSlotOrASEFlag: true
                      ResourceGroupName: $(ResourceGroupName)
                      SlotName: $(DeveloperSlot)
                      Package: $(Pipeline.Workspace)/drop/BancoAlimentar.AlimentaEstaIdeia.Web.zip
                      DeploymentType: zipDeploy

    - stage: DeployFunctionDeveloper
      displayName: Deploy function developer slot
      dependsOn: [DeployDeveloper, Build, BrowserRegression]
      condition: >-
        and(
          succeeded(),
          eq(dependencies.DeployDeveloper.result, 'Succeeded'),
          eq(dependencies.Build.result, 'Succeeded'),
          eq(dependencies.BrowserRegression.result, 'Succeeded'),
          ne(variables['Build.Reason'], 'PullRequest'),
          in(variables['Build.Reason'], 'IndividualCI', 'BatchedCI', 'Manual'),
          eq(variables['Build.SourceBranch'], 'refs/heads/developer')
        )
      jobs:
        - deployment: DeployFunction
          displayName: Deploy function to developer slot
          environment: Function developer
          pool:
            name: Default
          workspace:
            clean: all
          strategy:
            runOnce:
              deploy:
                steps:
                  - checkout: self
                    displayName: Checkout scripts
                    fetchDepth: 1

                  - download: current
                    artifact: drop

                  - task: AzureFunctionApp@2
                    displayName: Deploy function app (developer slot)
                    inputs:
                      azureSubscription: $(AzureServiceConnection)
                      appType: functionApp
                      appName: $(FunctionAppName)
                      deployToSlotOrASE: true
                      resourceGroupName: $(ResourceGroupName)
                      slotName: $(DeveloperSlot)
                      package: $(Pipeline.Workspace)/drop/BancoAlimentar.AlimentaEstaIdeia.Function.zip
                      deploymentMethod: runFromPackage

                  - task: AzureCLI@2
                    displayName: Disable function timers on developer slot
                    inputs:
                      azureSubscription: $(AzureServiceConnection)
                      scriptType: pscore
                      scriptPath: $(Build.SourcesDirectory)/scripts/configure-function-slot-timer-settings.ps1
                      scriptArguments: >-
                        -FunctionAppName "$(FunctionAppName)"
                        -ResourceGroupName "$(ResourceGroupName)"
                        -SlotName "$(DeveloperSlot)"
                      workingDirectory: $(Build.SourcesDirectory)

  - stage: DependencyAudit
    displayName: Audit NuGet dependencies
    dependsOn: []
    condition: or(eq(variables['Build.Reason'], 'Schedule'), eq(variables['Build.Reason'], 'Manual'))
    jobs:
      - job: DependencyAudit
        displayName: Audit NuGet dependencies
        pool:
          name: Default
        workspace:
          clean: all
        steps:
          - checkout: self
            persistCredentials: false

          - task: UseDotNet@2
            displayName: Use .NET SDK 10.0.x
            inputs:
              packageType: sdk
              version: 10.0.x

          - bash: |
              set -euo pipefail
              dotnet restore BancoAlimentar.AlimentaEstaIdeia.Web.sln --force-evaluate
            displayName: Restore with NuGet audit

          - bash: |
              set -euo pipefail
              dotnet list BancoAlimentar.AlimentaEstaIdeia.Web.sln package --vulnerable --include-transitive --no-restore
            displayName: Report vulnerable dependencies

          - bash: |
              set -euo pipefail
              dotnet list BancoAlimentar.AlimentaEstaIdeia.Web.sln package --outdated --no-restore
            displayName: Report outdated dependencies
