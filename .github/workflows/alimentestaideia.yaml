name: "Build and Test"

on:
  push:
    branches:
      - developer
      - master
    paths-ignore:
      - '**/*.md'
      - '**/*.gitignore'
      - '**/*.gitattributes'
  workflow_dispatch:

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: true
  DOTNET_GENERATE_ASPNET_CERTIFICATE: false
  DOTNET_ADD_GLOBAL_TOOLS_TO_PATH: false
  DOTNET_MULTILEVEL_LOOKUP: 0

jobs:
  build:
    name: Build
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v5
    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x
    - name: Restore
      run: dotnet restore
    - name: Build
      run: dotnet build --configuration Release --no-restore -v n
    - name: Upload build output
      uses: actions/upload-artifact@v7
      with:
        name: dotnet-release-build
        path: |
          **/bin/Release/
          **/obj/
        if-no-files-found: error
        retention-days: 1

  test:
    name: Test ${{ matrix.name }}
    needs: build
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Repository
            project: BancoAlimentar.AlimentaEstaIdeia.Repository.Tests/BancoAlimentar.AlimentaEstaIdeia.Repository.Tests.csproj
          - name: Sas.Core
            project: BancoAlimentar.AlimentaEstaIdeia.Sas.Core.Tests/BancoAlimentar.AlimentaEstaIdeia.Sas.Core.Tests.csproj
          - name: Integration
            project: BancoAlimentar.AlimentaEstaldeia.Web.IntegrationTests/BancoAlimentar.AlimentaEstaldeia.Web.Integration.Tests.csproj
          - name: Function
            project: BancoAlimentar.AlimentaEstaIdeia.Function.Tests/BancoAlimentar.AlimentaEstaIdeia.Function.Tests.csproj

    steps:
    - uses: actions/checkout@v5
    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x
    - name: Download build output
      uses: actions/download-artifact@v8
      with:
        name: dotnet-release-build
        path: .
    - name: Restore
      run: dotnet restore
    - name: Build test project
      run: dotnet build ${{ matrix.project }} --configuration Release --no-restore
    - name: Test
      run: dotnet test ${{ matrix.project }} --configuration Release --no-build --verbosity normal --collect:"XPlat Code Coverage" --settings coverlet.runsettings --logger "trx;LogFileName=${{ matrix.name }}.trx" --results-directory "TestResults/${{ matrix.name }}"
    - name: Upload test results and coverage
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: test-results-${{ matrix.name }}
        path: TestResults/${{ matrix.name }}/
        if-no-files-found: error
        retention-days: 14

  coverage:
    name: Merge coverage
    needs: test
    if: always() && needs.test.result != 'cancelled'
    runs-on: windows-latest

    steps:
    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x
    - name: Download test artifacts
      uses: actions/download-artifact@v8
      with:
        pattern: test-results-*
        path: TestResults
        merge-multiple: true
    - name: Install ReportGenerator
      run: dotnet tool install --global dotnet-reportgenerator-globaltool
    - name: Merge coverage reports
      shell: pwsh
      run: |
        reportgenerator -reports:"TestResults/**/coverage.cobertura.xml" -targetdir:"TestResults/CoverageReport" -reporttypes:"Cobertura;HtmlInline;MarkdownSummaryGithub"
        Get-Content "TestResults/CoverageReport/SummaryGithub.md" >> $env:GITHUB_STEP_SUMMARY
    - name: Upload merged coverage
      uses: actions/upload-artifact@v7
      with:
        name: code-coverage
        path: TestResults/CoverageReport/
        if-no-files-found: error
        retention-days: 14
