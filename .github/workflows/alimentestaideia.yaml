name: "Build and Test"

on:
  pull_request:
    branches:
      - developer
      - master
  push:
    branches:
      - developer
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: true
  DOTNET_GENERATE_ASPNET_CERTIFICATE: false
  DOTNET_ADD_GLOBAL_TOOLS_TO_PATH: false
  DOTNET_MULTILEVEL_LOOKUP: 0

jobs:
  build:
    name: Build
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v5
    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x
    - name: Restore
      run: dotnet restore
    - name: Build
      run: dotnet build --configuration Release --no-restore -v n
    - name: Upload build output
      uses: actions/upload-artifact@v7
      with:
        name: dotnet-release-build
        path: |
          **/bin/Release/
          **/obj/
        if-no-files-found: error
        retention-days: 1

  test:
    name: Test ${{ matrix.name }}
    needs: build
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Repository
            project: BancoAlimentar.AlimentaEstaIdeia.Repository.Tests/BancoAlimentar.AlimentaEstaIdeia.Repository.Tests.csproj
          - name: Sas.Core
            project: BancoAlimentar.AlimentaEstaIdeia.Sas.Core.Tests/BancoAlimentar.AlimentaEstaIdeia.Sas.Core.Tests.csproj
          - name: Integration
            project: BancoAlimentar.AlimentaEstaldeia.Web.IntegrationTests/BancoAlimentar.AlimentaEstaldeia.Web.Integration.Tests.csproj
          - name: Function
            project: BancoAlimentar.AlimentaEstaIdeia.Function.Tests/BancoAlimentar.AlimentaEstaIdeia.Function.Tests.csproj

    steps:
    - uses: actions/checkout@v5
    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x
    - name: Download build output
      uses: actions/download-artifact@v8
      with:
        name: dotnet-release-build
        path: .
    - name: Restore
      run: dotnet restore
    - name: Build test project
      run: dotnet build ${{ matrix.project }} --configuration Release --no-restore
    - name: Test
      run: dotnet test ${{ matrix.project }} --configuration Release --no-build --verbosity normal

  required:
    name: Required build and tests
    if: ${{ always() }}
    needs: [build, test]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every build and test job to succeed
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          if [[ "$BUILD_RESULT" != 'success' || "$TEST_RESULT" != 'success' ]]; then
            echo 'Build and all test jobs must succeed; failed, canceled, or skipped jobs cannot pass validation.' >&2
            exit 1
          fi
