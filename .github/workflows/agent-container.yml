name: Build and publish Azure DevOps agent

on:
  push:
    branches:
      - developer
    paths:
      - docker/azure-devops-agent/**
      - scripts/ci/tests/agent_container_test.py
      - .github/workflows/agent-container.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/banco-alimentar/alimentestaideia.pt/azure-devops-agent

jobs:
  publish:
    name: Publish Linux AMD64 agent
    if: github.repository == 'banco-alimentar/alimentestaideia.pt' && github.ref == 'refs/heads/developer'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Test agent scripts
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -m unittest discover -s scripts/ci/tests -p 'agent_container_test.py'
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push agent image
        uses: docker/build-push-action@v6
        with:
          context: ./docker/azure-devops-agent
          platforms: linux/amd64
          pull: true
          no-cache: true
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:ubuntu24.04
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
